name: Exportaramus
on:
  push:
    branches: [main]
    paths: ['Exportaramus/**', '.github/workflows/exportaramus-ci.yml']
  pull_request:
    paths: ['Exportaramus/**', '.github/workflows/exportaramus-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: exportaramus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and verify
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: Exportaramus
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: Exportaramus/global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare dependencies
        run: |
          ./tools/Get-BuildDependencies.ps1 -Destination "$env:RUNNER_TEMP/dalamud"
          "DALAMUD_HOME=$env:DALAMUD_HOME" >> $env:GITHUB_ENV
          python -m pip install -r tools/contract-python-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
      - name: Build, test, and check coverage
        run: ./tests/run-quality-gates.ps1 -CheckFormatting -OutputDirectory "$env:RUNNER_TEMP/exportaramus-results"
      - name: Verify package reproduction
        run: ./tools/Verify-Reproducibility.ps1 -OutputDirectory "$env:RUNNER_TEMP/exportaramus-results"

      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exportaramus-verification
          path: |
            ${{ runner.temp }}/exportaramus-results
            Exportaramus/project/bin/Release/Exportaramus/latest.zip
          if-no-files-found: warn
          retention-days: 7
