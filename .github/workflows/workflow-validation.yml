name: Workflow Validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/dependabot.yml']
  pull_request:
    paths: ['.github/workflows/**', '.github/dependabot.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Verified Actionlint
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
      - name: Validate All Workflows
        shell: bash
        run: '"$RUNNER_TEMP/actionlint" -color'
