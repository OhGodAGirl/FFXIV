name: Spring Cleaning
on:
  push:
    branches: [main]
    paths: ['SpringCleaning/**', '.github/workflows/springcleaning-ci.yml']
  pull_request:
    paths: ['SpringCleaning/**', '.github/workflows/springcleaning-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: springcleaning-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Build and verify
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: SpringCleaning
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: SpringCleaning/global.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare verified build dependencies
        run: |
          ./tools/Get-BuildDependencies.ps1 -Destination "$env:RUNNER_TEMP/springcleaning-dalamud"
          "DALAMUD_HOME=$env:DALAMUD_HOME" >> $env:GITHUB_ENV
      - name: Verify source, build, tests, coverage, and package
        run: ./tests/run-quality.ps1 -Lane Stabilization
      - name: Verify package reproduction
        run: ./tools/Verify-Reproducibility.ps1
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: springcleaning-verification
          path: |
            SpringCleaning/tests/TestResults
            SpringCleaning/project/bin/Release/SpringCleaning/latest.zip
          if-no-files-found: warn
          retention-days: 7
