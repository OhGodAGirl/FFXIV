name: Exportaramus Mutation Testing
run-name: Exportaramus Mutation Testing (${{ inputs.mode == 'full' && 'Full Campaign' || 'Setup Only' }}) — ${{ github.ref_name }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full campaign or setup verification without mutants
        type: choice
        required: true
        default: full
        options: [full, setup-only]
permissions:
  contents: read
concurrency:
  group: exportaramus-mutation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutation:
    name: Mutation Testing (${{ inputs.mode == 'full' && 'Full Campaign' || 'Setup Only' }})
    runs-on: windows-2025
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
        working-directory: Exportaramus
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      MUTATION_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: Exportaramus/global.json
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare dependencies and pinned mutation runner
        run: |
          ./tools/Get-BuildDependencies.ps1 -Destination "$env:RUNNER_TEMP/dalamud"
          "DALAMUD_HOME=$env:DALAMUD_HOME" >> $env:GITHUB_ENV
          python -m pip install -r tools/contract-python-requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependency installation failed.' }
          dotnet tool install dotnet-stryker --version 4.16.0 --tool-path "$env:RUNNER_TEMP/stryker"
          if ($LASTEXITCODE -ne 0) { throw 'Stryker installation failed.' }
          $runners = @(Get-ChildItem "$env:RUNNER_TEMP/stryker" -Recurse -Force -Filter Stryker.CLI.dll)
          if ($runners.Count -ne 1) { throw 'Expected one pinned Stryker runner.' }
          "STRYKER_RUNNER=$($runners[0].FullName)" >> $env:GITHUB_ENV
      - name: Verify the ordinary baseline
        timeout-minutes: 20
        run: ./tests/run-quality-gates.ps1 -CheckFormatting -OutputDirectory "$env:RUNNER_TEMP/exportaramus-mutation/baseline"
      - name: Run mutation tooling regression tests
        run: |
          foreach ($test in @('test-mutation-orchestration.py','test-individual-mutation.py','test-multi-stage-review.py','test-repair-bridge.py','test-qualification-workflows.py','test-mutation-runner.py')) {
            python "tools/$test"
            if ($LASTEXITCODE -ne 0) { throw "$test failed." }
          }
      - name: Run the selected mutation mode
        timeout-minutes: 300
        run: |
          ./tests/test-mutation.ps1 -Runner $env:STRYKER_RUNNER -Concurrency 2 -RunDirectory "$env:RUNNER_TEMP/exportaramus-mutation/campaign" -SetupOnly:($env:MUTATION_MODE -eq 'setup-only')
      - name: Preserve mutation reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exportaramus-mutation-${{ inputs.mode }}
          path: |
            ${{ runner.temp }}/exportaramus-mutation/**/*.json
            ${{ runner.temp }}/exportaramus-mutation/**/*.html
            ${{ runner.temp }}/exportaramus-mutation/**/*.log
            ${{ runner.temp }}/exportaramus-mutation/**/*.trx
            ${{ runner.temp }}/exportaramus-mutation/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7
