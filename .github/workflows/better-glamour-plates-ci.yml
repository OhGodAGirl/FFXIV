name: Better Glamour Plates
on:
  push:
    branches: [main]
    paths: ['BetterGlamorPlates/**', '.github/workflows/better-glamour-plates-ci.yml']
  pull_request:
    paths: ['BetterGlamorPlates/**', '.github/workflows/better-glamour-plates-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: better-glamour-plates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: BetterGlamorPlates
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: BetterGlamorPlates/global.json
      - name: Prepare pinned build dependencies
        run: |
          ./tools/Get-BuildDependencies.ps1 -Destination "$env:RUNNER_TEMP/dalamud"
          "DALAMUD_HOME=$env:DALAMUD_HOME" >> $env:GITHUB_ENV
      - name: Build, test, cover and inspect package
        run: ./tests/test-repository.ps1 -OutputDirectory "$env:RUNNER_TEMP/better-glamour-plates-results"
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: better-glamour-plates-verification
          path: |
            ${{ runner.temp }}/better-glamour-plates-results
            BetterGlamorPlates/bin/Release/BetterGlamorPlates/latest.zip
          if-no-files-found: warn
          retention-days: 7

